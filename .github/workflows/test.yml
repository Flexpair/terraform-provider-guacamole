name: test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l guacamole/*.go main.go)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            for f in $unformatted; do
              echo "::error file=$f::needs gofmt (run 'gofmt -w $f')"
            done
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify vendored library patches
        run: |
          bash scripts/restore-vendored-guacamole-patches.sh
          git diff --exit-code -- vendor/

      - name: Run Go tests
        run: go test -v ./...

      - name: Build provider
        run: go build -tags timetzdata -o terraform-provider-guacamole
